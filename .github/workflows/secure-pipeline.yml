#TODO: fix: lowercase repo names shouldn't be hardcoded

name: Secure CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Global default: strictly restrict all token permissions to read-only
permissions:
  contents: read

jobs:
  sast-codeql:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required for CodeQL to upload findings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  build-scan-deploy:
    name: Build, Scan, and Publish Container
    runs-on: ubuntu-latest
    needs: sast-codeql
    permissions:
      contents: read
      packages: write      
      security-events: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true 
          tags: ghcr.io/thejapanesecowboy/uta_cyber/secure-api:latest

      - name: Run Trivy Vulnerability Scanner
        id: trivy_scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/thejapanesecowboy/uta_cyber/secure-api:latest'
          format: 'sarif'        # MUST BE SARIF to satisfy the upload step
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true 
          exit-code: '0' # Set to 0 to guarantee the pipeline completes successfully

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4 # fixing deprication warning 
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push Docker Image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/thejapanesecowboy/uta_cyber/secure-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
